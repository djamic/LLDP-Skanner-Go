<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLDP Scanner Login</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <main class="login-card">
        <h1>🌐 LLDP Network Scanner</h1>
        <form id="loginForm" autocomplete="on">
            <label for="loginUser">User</label>
            <input id="loginUser" name="username" autocomplete="username" required autofocus>
            <label for="loginPassword">Password</label>
            <input id="loginPassword" name="password" type="password" autocomplete="current-password" required>
            <button type="submit" id="loginSubmit">Log in</button>
            <p id="loginError" class="login-error" role="alert" hidden></p>
        </form>
        <p id="loginNoUser" class="login-note" hidden>
            No web user yet. On the server run:<br><code>sudo ./lldp_scanner --user-add admin</code>
        </p>
    </main>
    <script src="login.js"></script>
</body>

</html>
